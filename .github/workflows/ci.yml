name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ui:
    name: Browser surface contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Check browser surface contracts
        run: pnpm run test:browser

      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-surface-failures
          path: test-results/
          retention-days: 7

  verify:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The fork builds for macOS and Linux only (POSIX sockets, safe file reads), so Windows is not a target.
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck, lint, knip and vitest run in parallel in this one job: a second job would pay a
      # second install, and vitest dominates the wall time either way.
      - name: Verify (typecheck, lint, knip, test in parallel)
        run: pnpm run verify

      - name: Build
        run: pnpm run build

      - name: Check delivery artifacts
        run: npm run check:artifacts

      # Registry installs and native PTY checks belong to the main/manual delivery
      # gate, not every PR. publish.yml also runs this before publication.
      - name: Smoke test npm 12 global package install (main/manual)
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: npm run smoke:package-install
