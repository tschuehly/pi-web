<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbench real-component manual zoom geometry</title>
  <style>
    :root {
      --pi-interface-scale: 1;
      zoom: var(--pi-interface-scale);
      color-scheme: dark;
      --pi-bg: #0d1117;
      --pi-surface: #151b23;
      --pi-surface-hover: #212830;
      --pi-border: #5e6876;
      --pi-border-muted: #3d444d;
      --pi-text: #f0f6fc;
      --pi-text-bright: #fff;
      --pi-muted: #9198a1;
      --pi-accent: #4493f8;
      --pi-danger: #f85149;
      --pi-shadow: #01040999;
      --pi-control-min-size: 32px;
      --pi-control-padding-block: 6px;
      --pi-control-padding-inline: 8px;
    }
    html, body { margin: 0; overflow: hidden; background: var(--pi-bg); }
    .workbench-host {
      --pi-workbench-viewport-height: calc(100dvh / var(--pi-interface-scale, 1));
      --pi-workbench-viewport-width: calc(100dvw / var(--pi-interface-scale, 1));
      position: fixed;
      inset: 0 auto auto 0;
      width: var(--pi-workbench-viewport-width);
      height: var(--pi-workbench-viewport-height);
      overflow: hidden;
    }
    .toolbar { position: absolute; z-index: 2; top: 8px; right: 12px; display: flex; align-items: center; gap: 12px; }
    .trailing-action { box-sizing: border-box; width: 32px; height: 32px; padding: 0; }
    chat-view { position: absolute; inset: 56px 0 0; display: block; }
  </style>
</head>
<body>
  <main class="workbench-host">
    <!-- Manual Chromium evidence using real components and a trailing header action. -->
    <div class="toolbar"><workbench-settings-panel></workbench-settings-panel><button class="trailing-action" type="button">?</button></div>
    <chat-view></chat-view>
  </main>
  <script type="module">
    import "../src/components/ChatView.ts";
    import "../src/components/WorkbenchSettingsPanel.ts";

    const settings = document.querySelector("workbench-settings-panel");
    settings.themePreference = { themeId: "builtin:dark", auto: false };

    const chat = document.querySelector("chat-view");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600"><rect width="2400" height="1600" fill="#4493f8"/></svg>`;
    chat.sessionId = "geometry";
    chat.messages = [{ role: "user", parts: [{ type: "image", mimeType: "image/svg+xml", data: btoa(svg) }] }];

    const frame = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const rect = (element) => {
      const value = element.getBoundingClientRect();
      return { top: value.top, right: value.right, bottom: value.bottom, left: value.left, width: value.width, height: value.height };
    };
    const elements = () => ({
      trigger: settings.shadowRoot.querySelector(".trigger"),
      popover: settings.shadowRoot.querySelector(".popover"),
      preview: chat.shadowRoot.querySelector(".chat-image"),
      dialog: chat.shadowRoot.querySelector("dialog.image-zoom"),
    });
    async function openSettings(scale) {
      document.documentElement.style.setProperty("--pi-interface-scale", String(scale));
      await frame();
      const current = elements();
      if (current.dialog?.open) current.dialog.close();
      if (current.popover) current.trigger.click();
      current.trigger.click();
      await settings.updateComplete;
      await frame();
    }
    async function measureWithImage(trigger, popover) {
      elements().trigger.click();
      elements().preview.click();
      await chat.updateComplete;
      await frame();
      const current = elements();
      const image = current.dialog.querySelector(".image-zoom-full");
      const close = current.dialog.querySelector(".image-zoom-close");
      return {
        viewport: { width: innerWidth, height: innerHeight },
        scale: Number(getComputedStyle(document.documentElement).getPropertyValue("--pi-interface-scale")),
        trigger,
        popover,
        dialog: rect(current.dialog),
        image: rect(image),
        close: rect(close),
        imageOpen: current.dialog.open,
      };
    }
    window.zoomComponentFixture = {
      async measure(scale) {
        await openSettings(scale);
        return measureWithImage(rect(elements().trigger), rect(elements().popover));
      },
      async measureLive(from, to) {
        await openSettings(from);
        const select = settings.shadowRoot.querySelector("#workbench-settings-scale");
        select.value = String(to);
        select.dispatchEvent(new Event("change"));
        await settings.updateComplete;
        await frame();
        return measureWithImage(rect(elements().trigger), rect(elements().popover));
      },
      imageOpen() { return elements().dialog.open; },
    };
  </script>
</body>
</html>
