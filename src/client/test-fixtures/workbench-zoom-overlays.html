<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbench zoom overlay geometry fixture</title>
  <style>
    :root { --pi-interface-scale: 1; zoom: var(--pi-interface-scale); color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: #0d1117; }
    .shell {
      --pi-workbench-viewport-height: calc(100dvh / var(--pi-interface-scale, 1));
      --pi-workbench-viewport-width: calc(100dvw / var(--pi-interface-scale, 1));
      position: fixed;
      inset: 0 auto auto 0;
      width: 100%;
      height: var(--pi-workbench-viewport-height);
      overflow: hidden;
    }
    .overlay { position: fixed; inset: 0; display: none; color: #f0f6fc; font: 14px system-ui, sans-serif; }
    .overlay.active { display: block; }
    .backdrop { width: 100%; height: var(--pi-workbench-viewport-height, 100%); display: grid; place-items: var(--place-items, center); padding: var(--top, 20px) 20px var(--bottom, 20px); overflow: hidden; background: #010409cc; }
    .surface { width: min(var(--surface-width, 720px), calc(var(--pi-workbench-viewport-width, 100vw) - 40px)); max-width: 100%; max-height: min(var(--surface-height, 640px), calc(var(--pi-workbench-viewport-height, 100vh) - var(--top, 20px) - var(--bottom, 20px))); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #5e6876; border-radius: 12px; background: #151b23; }
    .overlay[data-overlay="action-palette"] { --place-items: start center; --top: min(12dvh, 90px); --bottom: 20px; }
    .overlay[data-overlay="project-dialog"] { --place-items: start center; --top: min(12vh, 90px); --bottom: 0px; --surface-height: 700px; }
    .overlay[data-overlay="machine-dialog"] { --place-items: start center; --top: min(12vh, 90px); --bottom: 0px; --surface-width: 560px; }
    .overlay[data-overlay="session-tree-navigator"] .backdrop { padding: 0; }
    .overlay[data-overlay="session-tree-navigator"] .surface { width: 100%; height: var(--pi-workbench-viewport-height, 100dvh); max-height: var(--pi-workbench-viewport-height, 100dvh); border: 0; border-radius: 0; }
    .overlay[data-overlay="workstream-context-drawer"] { position: absolute; top: 56px; }
    .overlay[data-overlay="workstream-context-drawer"] .surface { width: 100%; max-height: calc(var(--pi-workbench-viewport-height, 100vh) - 56px); border-radius: 0; overflow: auto; }
    header, footer { flex: 0 0 auto; min-height: 48px; display: grid; place-items: center; border-bottom: 1px solid #5e6876; }
    footer { border-top: 1px solid #5e6876; border-bottom: 0; }
    [data-scroll] { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .row { min-height: 40px; padding: 10px; border-bottom: 1px solid #3d444d; }
  </style>
</head>
<body>
  <main class="shell" data-shell></main>
  <script>
    const shell = document.querySelector("[data-shell]");
    const overlays = [
      "model-picker",
      "session-tree-navigator",
      "action-palette",
      "command-picker",
      "auth-dialog",
      "project-dialog",
      "machine-dialog",
      "workstream-context-drawer",
    ];
    for (const name of overlays) {
      const overlay = document.createElement("section");
      overlay.className = "overlay";
      overlay.dataset.overlay = name;
      const content = `<article class="surface" data-panel><header>${name}</header><div data-scroll></div><footer>Actions</footer></article>`;
      overlay.innerHTML = name === "workstream-context-drawer" ? content : `<div class="backdrop">${content}</div>`;
      const scroll = overlay.querySelector("[data-scroll]");
      for (let index = 0; index < 50; index += 1) {
        const row = document.createElement("div");
        row.className = "row";
        row.textContent = `Row ${index + 1}`;
        scroll.append(row);
      }
      shell.append(overlay);
    }

    const rect = (element) => {
      const value = element.getBoundingClientRect();
      return { top: value.top, right: value.right, bottom: value.bottom, left: value.left, width: value.width, height: value.height };
    };
    window.zoomOverlayFixture = {
      overlays,
      measure(scale, name) {
        document.documentElement.style.setProperty("--pi-interface-scale", String(scale));
        document.querySelectorAll("[data-overlay]").forEach((overlay) => { overlay.classList.toggle("active", overlay.dataset.overlay === name); });
        const overlay = document.querySelector(`[data-overlay="${name}"]`);
        const panel = overlay.querySelector("[data-panel]");
        const scroll = overlay.querySelector("[data-scroll]");
        scroll.scrollTop = scroll.scrollHeight;
        return {
          scale,
          name,
          viewport: { width: innerWidth, height: innerHeight },
          shell: rect(shell),
          overlay: rect(overlay),
          panel: rect(panel),
          scroll: { clientHeight: scroll.clientHeight, scrollHeight: scroll.scrollHeight, scrollTop: scroll.scrollTop },
          document: { clientWidth: document.documentElement.clientWidth, clientHeight: document.documentElement.clientHeight, scrollWidth: document.documentElement.scrollWidth, scrollHeight: document.documentElement.scrollHeight },
        };
      },
    };
  </script>
</body>
</html>
