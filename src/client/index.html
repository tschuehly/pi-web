<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Pi Workbench</title>
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" crossorigin="use-credentials" href="%BASE_URL%manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        --pi-control-font-size: 16px;
        --pi-control-font-family: system-ui, sans-serif;
        --pi-control-monospace-font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --pi-control-min-size: 32px;
        --pi-control-padding-block: 6px;
        --pi-control-padding-inline: 8px;
        --pi-list-row-padding-block: 6px;
        --pi-list-row-padding-inline: 8px;
        --pi-list-primary-display: flex;
        --pi-list-secondary-display: block;
        --pi-list-secondary-margin-inline: 0px;
        --pi-list-row-white-space: normal;
        --pi-panel-padding: 10px;
        --pi-toolbar-gap: 6px;
        --pi-message-padding: 10px;
        --pi-message-gap: 10px;
        --pi-content-max-width: none;
        --pi-bg: #0d1117;
        --pi-surface: #151b23;
        --pi-surface-hover: #212830;
        --pi-terminal-bg: #010409;
        --pi-terminal-text: #f0f6fc;
        --pi-border: #5e6876;
        --pi-border-muted: #3d444db3;
        --pi-text: #f0f6fc;
        --pi-text-secondary: #b7bdc8;
        --pi-text-bright: #ffffff;
        --pi-muted: #9198a1;
        --pi-dim: #9198a1;
        --pi-accent: #4493f8;
        --pi-accent-border: #1f6feb;
        --pi-selection-bg: #388bfd26;
        --pi-success: #3fb950;
        --pi-success-border: #238636;
        --pi-success-bg: #2ea04326;
        --pi-success-surface: #2ea04326;
        --pi-success-ring: #3fb95055;
        --pi-warning: #d29922;
        --pi-warning-border: #9e6a03;
        --pi-warning-surface: #bb800926;
        --pi-danger: #f85149;
        --pi-purple: #ab7df8;
        --pi-purple-border: #8957e5;
        --pi-purple-surface: #ab7df826;
        --pi-overlay: #010409cc;
        --pi-shadow-soft: #01040966;
        --pi-shadow: #01040999;
        --pi-shadow-strong: #010409cc;
        --pi-bg-overlay-soft: #0d1117dd;
        --pi-bg-overlay: #0d1117e6;
        --pi-success-bg-overlay: #2ea04326;
        --pi-terminal-selection: #264f78;
      }
      :root[data-pi-web-density="compact"] {
        --pi-control-min-size: 26px;
        --pi-control-padding-block: 3px;
        --pi-control-padding-inline: 6px;
        --pi-list-row-padding-block: 2px;
        --pi-list-row-padding-inline: 5px;
        --pi-list-primary-display: inline-flex;
        --pi-list-secondary-display: inline;
        --pi-list-secondary-margin-inline: 5px;
        --pi-list-row-white-space: nowrap;
        --pi-panel-padding: 6px;
        --pi-toolbar-gap: 3px;
        --pi-message-padding: 6px;
        --pi-message-gap: 6px;
      }
      @media (pointer: coarse) {
        :root {
          --pi-control-min-size: 44px !important;
          --pi-control-padding-block: 9px !important;
          --pi-control-padding-inline: 10px !important;
          --pi-list-row-padding-block: 9px !important;
          --pi-list-row-padding-inline: 10px !important;
        }
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); }
      body { min-height: calc(100dvh / var(--pi-interface-scale, 1)); }
    </style>
  </head>
  <body>
    <pi-workbench-app></pi-workbench-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
